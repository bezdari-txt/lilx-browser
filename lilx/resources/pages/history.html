<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}" data-private="{{private}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="history.title"></title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/lilx.css">
  <link rel="stylesheet" href="/assets/theme.css" id="theme-css">
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/lilx.js" defer></script>
  <script src="/assets/history.js" defer></script>
</head>
<body class="page-history">
  <header class="topbar">
    <a class="brand" href="lilx://home">lil<span>x</span></a>
    <nav class="nav">
      <a href="lilx://history" aria-current="page" data-i18n="nav.history"></a>
      <a href="lilx://downloads" data-i18n="nav.downloads"></a>
      <a href="lilx://extensions" data-i18n="nav.extensions"></a>
      <a href="lilx://settings" data-i18n="nav.settings"></a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1 data-i18n="history.title"></h1>
        <p class="subtitle" id="status" data-i18n="history.local"></p>
      </div>
      <button class="danger" id="clear-all" type="button" data-i18n="history.clear_all"></button>
    </div>

    <div class="card">
      <input id="query" type="search" data-i18n-placeholder="history.search" aria-label="Search" autofocus>
      <div id="entries" class="entries"></div>
      <div class="actions center">
        <button id="more" type="button" class="ghost" hidden data-i18n="history.more"></button>
      </div>
    </div>
  </main>
</body>
</html>
