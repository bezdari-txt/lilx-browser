<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extensions.title"></title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/lilx.css">
  <link rel="stylesheet" href="/assets/theme.css" id="theme-css">
  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/lilx.js" defer></script>
  <script src="/assets/extensions.js" defer></script>
</head>
<body class="page-extensions">
  <header class="topbar">
    <a class="brand" href="lilx://home">lil<span>x</span></a>
    <nav class="nav">
      <a href="lilx://history" data-i18n="nav.history"></a>
      <a href="lilx://downloads" data-i18n="nav.downloads"></a>
      <a href="lilx://extensions" aria-current="page" data-i18n="nav.extensions"></a>
      <a href="lilx://settings" data-i18n="nav.settings"></a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1 data-i18n="extensions.title"></h1>
        <p class="subtitle" data-i18n="extensions.subtitle"></p>
      </div>
      <div class="actions">
        <button class="primary" id="install-zip" type="button" data-i18n="extensions.install_zip"></button>
        <button id="install-folder" type="button" data-i18n="extensions.install_folder"></button>
      </div>
    </div>

    <div id="errors"></div>

    <div class="card">
      <input id="query" type="search" data-i18n-placeholder="extensions.search" aria-label="Search">
      <div id="list" class="entries"></div>
    </div>

    <p class="hint center-hint" data-i18n="extensions.note"></p>
  </main>
</body>
</html>
